  <g transform="translate(100, 100) scale(0.6)">
    <!-- Central Hexagon -->
    <path d="M250 50 L423 150 V350 L250 450 L77 350 V150 Z" fill="none" stroke="#007bff" stroke-width="40" stroke-linejoin="round"/>
    
    <!-- Inner Connections -->
    <circle cx="250" cy="250" r="60" fill="#007bff"/>
    <line x1="250" y1="50" x2="250" y2="190" stroke="#007bff" stroke-width="30" stroke-linecap="round"/>
    <line x1="423" y1="350" x2="300" y2="280" stroke="#007bff" stroke-width="30" stroke-linecap="round"/>
    <line x1="77" y1="350" x2="200" y2="280" stroke="#007bff" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
