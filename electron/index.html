<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ferramentas de Rede</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #09090b;
    background-image: radial-gradient(circle at center, #1a1a1a 0%, #09090b 100%);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }

  #initial-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease-out;
  }

  .logo-container {
    position: relative;
    width: 160px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
  }

  .logo {
    width: 80px;
    height: 80px;
    z-index: 10;
    filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
    animation: breathe 3s ease-in-out infinite;
    position: relative;
  }

  /* Ripples */
  .ripple {
    position: absolute;
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 50%;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
  }

  .ripple:nth-child(1) {
    animation-delay: 0s;
  }

  .ripple:nth-child(2) {
    animation-delay: 1s;
  }

  .ripple:nth-child(3) {
    animation-delay: 2s;
  }

  /* Drops / Orbiting Particles */
  .orbit {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    animation: rotate 8s linear infinite;
  }

  .drop {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #3b82f6;
    border-radius: 50%;
    box-shadow: 0 0 10px #3b82f6;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
  }

  .orbit:nth-child(4) {
    width: 120%;
    height: 120%;
    animation-duration: 6s;
    opacity: 0.6;
  }

  .orbit:nth-child(5) {
    width: 140%;
    height: 140%;
    animation-duration: 10s;
    animation-direction: reverse;
    opacity: 0.4;
  }

  .app-title {
    color: #ffffff;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.8s ease-out 0.5s forwards;
    background: linear-gradient(to right, #fff, #94a3b8, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    background-size: 200% auto;
    animation: fadeUp 0.8s ease-out 0.5s forwards, shine 3s linear infinite;
  }

  .app-subtitle {
    color: #52525b;
    font-size: 0.875rem;
    margin-top: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.8s forwards;
  }

  @keyframes breathe {

    0%,
    100% {
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
    }

    50% {
      transform: scale(1.05);
      filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.6));
    }
  }

  @keyframes ripple {
    0% {
      transform: scale(0.5);
      opacity: 0.5;
      border-width: 2px;
    }

    100% {
      transform: scale(2.5);
      opacity: 0;
      border-width: 0px;
    }
  }

  @keyframes rotate {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes shine {
    to {
      background-position: 200% center;
    }
  }
</style>
</head>

<body>
  <div id="initial-loader">
    <div class="logo-container">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>

      <!-- Orbiting Drops -->
      <div class="orbit">
        <div class="drop"></div>
      </div>
      <div class="orbit">
        <div class="drop"></div>
      </div>

      <img src="/logo.png?v=4" alt="Ferramentas de Rede" class="logo" />
    </div>
    <div class="app-title">Ferramentas de Rede</div>
    <div class="app-subtitle">Inicializando sistema...</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
