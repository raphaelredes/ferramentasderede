<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy.
      - default-src 'self': baseline lockdown.
      - script-src: 'self' + 'unsafe-inline'/'unsafe-eval' needed for Vite HMR in dev
        and for some recharts internals.
      - style-src: 'unsafe-inline' for Tailwind-injected styles + recharts.
      - connect-src: only the local FastAPI (127.0.0.1:8000) and the webview static port.
      - img-src/font-src/media-src: self + data: for inline SVG icons/PNG logos.
      - object-src 'none' + base-uri 'self' to harden against legacy embed vectors.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 http://127.0.0.1:5173 http://localhost:5173 http://127.0.0.1:5174 http://localhost:5174 ws://127.0.0.1:5173 ws://localhost:5173 ws://127.0.0.1:8000 ws://localhost:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
<title>Ferramentas de Rede</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #09090b;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
</style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>


</html>
